# GELLO -> Franka Panda teleoperation configuration.
#
# Values here are loaded by launch/gello.launch.py. With --symlink-install
# (used by build_ws.sh) edits take effect on the next launch, no rebuild.
# The serial port and backend are launch arguments (see the Makefile).

gello_driver:
  ros__parameters:
    baudrate: 57600

    # Servo ids of J1..J7 on the Dynamixel bus
    joint_ids: [1, 2, 3, 4, 5, 6, 7]

    # --- Per-unit calibration -------------------------------------------
    # Specific to each physical GELLO. Generate them with
    #   make gello-offsets GELLO_SIGNS="..."
    # or copy them from the unit's entry in gello_software's
    # gello/agents/gello_agent.py (PORT_CONFIG_MAP: joint_offsets,
    # joint_signs, gripper_config = (id, open_deg, closed_deg)).
    #
    # Until joint_offsets are set, only the fake backend starts.
    #
    # Measured on the lab's GELLO with the sim's home pose. J7's offset is
    # 5*pi/4, not a multiple of pi/2: the gripper opens sideways at J7 = 45 deg,
    # like the Panda's hand. 'make gello-offsets' can't produce this value.
    # In pi/2 units: [4, 2, 3, 2, 4, 2, 2.5]
    joint_offsets: [6.283185, 3.141593, 4.712389, 3.141593, 6.283185, 3.141593, 3.926991]
    joint_signs: [1, 1, 1, 1, 1, -1, 1]
    # Servos lose their turn count on power-up. Each joint is shifted by whole
    # turns to the value closest to this pose: the center of the Panda's range,
    # so the result is right anywhere in the robot's range.
    reference_pose: [0.0, 0.0, 0.0, -1.57, 0.0, 1.87, 0.0]
    gripper_id: 8       # -1 if the GELLO has no gripper trigger
    gripper_open_deg: 198.37
    gripper_closed_deg: 144.84
    # ---------------------------------------------------------------------

    # Exponential smoothing (1.0 = none), same as gello_software
    smoothing_alpha: 0.99

    # Fake backend (no hardware): joints oscillate around fake_home
    fake_rate: 200.0
    fake_home: [0.0, 0.0, 0.0, -1.57, 0.0, 1.57, 0.71]
    fake_amplitude: 0.1      # rad
    fake_frequency: 0.1      # Hz

gello_calibrator:
  ros__parameters:
    gello_topic: /gello/joint_states
    panda_state_topic: /sim_asimilar_01/panda_arm/state
    target_topic: /gello/target_joint_states
    posref_topic: /sim_asimilar_01/panda_arm/posref

    # Franka Panda joint position limits (rad), J1..J7
    panda_joint_lower: [-2.8973, -1.7628, -2.8973, -3.0718, -2.8973, -0.0175, -2.8973]
    panda_joint_upper: [2.8973, 1.7628, 2.8973, -0.0698, 2.8973, 3.7525, 2.8973]

    enable_tolerance: 0.1    # rad, largest GELLO-Panda difference to enable
    max_sample_change: 0.5   # rad, a larger GELLO jump disables control
    data_timeout: 0.3        # s, control disables if data stops
    status_interval: 1.0     # s, how often the status is logged
